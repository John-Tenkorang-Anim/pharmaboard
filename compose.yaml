name: pharmaboard

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: pharmaboard
      POSTGRES_USER: pharmaboard
      POSTGRES_PASSWORD: pharmaboard
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmaboard -d pharmaboard"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - pharmaboard-postgres:/var/lib/postgresql/data

volumes:
  pharmaboard-postgres:
